<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}校园二手交易平台{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-success mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">🛒 校园二手集市</a>
    <div class="navbar-nav ms-auto align-items-center">
      {% if user.is_authenticated %}
        <span class="navbar-text me-3">你好，{{ user.username }}</span>
        <a class="nav-link" href="{% url 'profile' %}">个人中心</a>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-link nav-link">退出</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">登录</a>
        <a class="btn btn-light btn-sm ms-2" href="{% url 'register' %}">注册</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container" style="max-width: 560px;">
  {% for message in messages %}
    <div class="alert alert-warning alert-dismissible">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
