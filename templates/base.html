{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}校园二手集市{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #0e8a63;
      --brand-dark: #0a6b4d;
      --brand-light: #e6f6f0;
      --ink: #1f2d3d;
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f4f7f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; }
    /* 导航栏 */
    .navbar-main {
      background: #ffffff;
      box-shadow: 0 1px 8px rgba(16, 60, 45, .08);
    }
    .navbar-main .navbar-brand {
      color: var(--brand-dark);
      font-weight: 700;
      letter-spacing: .5px;
    }
    .navbar-main .nav-link { color: #4b5b68; }
    .navbar-main .nav-link:hover { color: var(--brand); }
    /* 主按钮 */
    .btn-brand {
      background: var(--brand);
      color: #fff;
      border: none;
    }
    .btn-brand:hover { background: var(--brand-dark); color: #fff; }
    /* 页头横幅 */
    .hero {
      background: linear-gradient(135deg, #0e8a63 0%, #0d5c46 60%, #094434 100%);
      color: #fff;
      border-radius: 16px;
      padding: 56px 40px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -60px; top: -60px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
    }
    .hero::before {
      content: "";
      position: absolute;
      right: 80px; bottom: -90px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .06);
    }
    .hero h1 { font-weight: 700; letter-spacing: 1px; }
    /* 卡片 */
    .card-soft {
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(16, 60, 45, .07);
    }
    .feature-icon {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: var(--brand-light);
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    /* 表单卡片 */
    .auth-card {
      max-width: 440px;
      margin: 32px auto 0;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(16, 60, 45, .10);
    }
    .auth-card .card-body { padding: 36px; }
    .form-control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 .2rem rgba(14, 138, 99, .15);
    }
    /* 页脚 */
    .site-footer {
      background: #123529;
      color: #9fb8ad;
      padding: 24px 0;
      font-size: 14px;
    }
    .site-footer a { color: #cfe4da; text-decoration: none; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-main sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <span class="feature-icon" style="width:36px;height:36px;font-size:18px;"><i class="bi bi-bag-heart"></i></span>
      校园二手集市
    </a>
    <div class="navbar-nav ms-auto align-items-center gap-1">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-shop me-1"></i>逛逛</a>
        <a class="nav-link" href="{% url 'profile' %}"><i class="bi bi-person me-1"></i>个人中心</a>
        <form method="post" action="{% url 'logout' %}" class="d-inline ms-2">
          {% csrf_token %}
          <button class="btn btn-outline-secondary btn-sm">退出登录</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right me-1"></i>登录</a>
        <a class="btn btn-brand btn-sm ms-2 px-3" href="{% url 'register' %}">免费注册</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4" style="max-width: 960px;">
  {% for message in messages %}
    <div class="alert alert-warning alert-dismissible fade show">{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<footer class="site-footer mt-auto">
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <span><i class="bi bi-bag-heart me-1"></i>校园二手集市 · 让闲置流动起来</span>
    <span>由 <a href="https://github.com/songxufeng-Seanfin">songxufeng-Seanfin</a> 用 Django 构建并开源</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
