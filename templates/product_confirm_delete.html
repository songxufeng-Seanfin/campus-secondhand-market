{% extends "base.html" %}
{% block title %}删除确认 - 闲小集{% endblock %}
{% block content %}
<div class="card-soft confirm-card">
  <div class="card-body text-center">
    <div class="confirm-icon"><i class="bi bi-trash3"></i></div>
    <h1 class="confirm-title">确定删除这件闲置吗？</h1>
    <p class="confirm-text">「{{ product.title }}」删除后无法恢复，图片也会一起清理掉。</p>
    <form method="post" class="d-flex gap-2 justify-content-center">
      {% csrf_token %}
      <button type="submit" class="btn btn-brand px-4" style="background:#c94f4f;border-color:#c94f4f;">确认删除</button>
      <a href="{% url 'my_products' %}" class="btn btn-ghost px-4">取消</a>
    </form>
  </div>
</div>

<style>
  .confirm-card { max-width: 460px; margin: 56px auto; }
  .confirm-card .card-body { padding: 36px 32px 32px; }
  .confirm-icon {
    width: 48px; height: 48px;
    margin: 0 auto;
    border-radius: var(--r);
    background: #fdf2f2;
    color: #c94f4f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
  }
  .confirm-title { font-size: 17px; font-weight: 500; color: var(--ink); margin: 18px 0 10px; }
  .confirm-text { font-size: 13px; color: var(--text-2); line-height: 1.8; margin: 0 0 26px; }
</style>
{% endblock %}
