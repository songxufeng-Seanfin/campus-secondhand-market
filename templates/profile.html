{% extends "base.html" %}
{% block title %}个人中心 - 校园二手集市{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h4 class="card-title mb-4">个人中心</h4>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">用户名：{{ user.username }}</li>
      <li class="list-group-item">手机号：{{ user.phone|default:"未填写" }}</li>
      <li class="list-group-item">注册时间：{{ user.date_joined|date:"Y-m-d H:i" }}</li>
    </ul>
  </div>
</div>
{% endblock %}
