{% extends "base.html" %}
{% block title %}个人中心 - 闲小集{% endblock %}
{% block content %}

<div class="card-soft mb-4">
  <div class="card-body profile-head">
    <div class="avatar"><i class="bi bi-person"></i></div>
    <div>
      <h1 class="profile-name">{{ user.username }}</h1>
      <p class="section-sub mb-0">校园认证用户</p>
    </div>
  </div>

  <div class="profile-grid">
    <div class="profile-cell">
      <div class="cell-label"><i class="bi bi-telephone"></i>手机号</div>
      <div class="cell-value">{{ user.phone|default:"未填写" }}</div>
    </div>
    <div class="profile-cell">
      <div class="cell-label"><i class="bi bi-envelope"></i>邮箱</div>
      <div class="cell-value">{{ user.email|default:"未绑定" }}</div>
    </div>
    <div class="profile-cell">
      <div class="cell-label"><i class="bi bi-calendar-check"></i>注册时间</div>
      <div class="cell-value">{{ user.date_joined|date:"Y-m-d" }}</div>
    </div>
  </div>
</div>

<div class="card-soft">
  <div class="card-body d-flex align-items-center justify-content-between">
    <div>
      <div class="profile-name" style="font-size:15px;">我发布的闲置</div>
      <p class="section-sub mb-0">在售、已售出、已下架的商品都能在这里管理</p>
    </div>
    <a href="{% url 'my_products' %}" class="btn btn-ghost btn-sm px-3">进入管理</a>
  </div>
</div>

<style>
  .profile-head { display: flex; align-items: center; gap: 16px; padding: 26px 26px 20px; }
  .avatar {
    width: 56px; height: 56px;
    border-radius: var(--r);
    background: var(--brand-light);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex: none;
  }
  .profile-name { font-size: 18px; font-weight: 500; color: var(--ink); margin: 0 0 4px; }
  .profile-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line-soft);
  }
  .profile-cell { padding: 18px 26px; border-right: 1px solid var(--line-soft); }
  .profile-cell:last-child { border-right: none; }
  .cell-label { font-size: 12.5px; color: var(--text-3); margin-bottom: 6px; }
  .cell-label i { margin-right: 4px; }
  .cell-value { font-size: 14px; color: var(--text); }
  @media (max-width: 767.98px) {
    .profile-grid { grid-template-columns: 1fr; }
    .profile-cell { border-right: none; border-bottom: 1px solid var(--line-soft); }
    .profile-cell:last-child { border-bottom: none; }
  }
</style>
{% endblock %}
